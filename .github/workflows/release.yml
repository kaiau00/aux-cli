name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.23.2"
          cache: true
          cache-dependency-path: go.sum

      - run: go mod download

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          # The workflow's own token. This used to be HOMEBREW_GITHUB_TOKEN, a
          # cross-repository token needed back when goreleaser also pushed to a
          # Homebrew tap and to AUR. Those blocks are gone from .goreleaser.yml,
          # so the only thing left to authenticate is publishing the release to
          # this repository -- which the built-in token already covers.
          #
          # That secret was never set (the repository has none), so it resolved
          # to an empty string and the first tag pushed would have failed to
          # publish. AUR_KEY went the same way and is dropped with it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
